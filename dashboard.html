<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Равоншинос</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Равоншинос</a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
      </nav>
      <div class="header-buttons">
        <button onclick="logout()" class="btn btn-secondary">Выйти</button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 id="welcome">Личный кабинет</h1>
      <p class="auth-subtitle">Здесь будут ваши записи к психологам</p>

      <div class="card" style="margin-top: 30px;">
        <h3>Мои записи</h3>
        <p style="color: var(--text-muted); margin-top: 10px;">
          Пока нет записей. <a href="catalog.html" style="color: var(--sage);">Найти психолога →</a>
        </p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2025 Равоншинос. Все права защищены.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    // Проверка входа
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!user) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('welcome').textContent = 'Привет, ' + user.name + '!';
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
