<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Равоншинос</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Равоншинос</a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
      </nav>
      <div class="header-buttons">
        <span id="userEmail" class="user-email"></span>
        <button onclick="logout()" class="btn btn-secondary">Выйти</button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 id="welcome">Личный кабинет</h1>
      <p class="auth-subtitle">Здесь ваши записи к психологам</p>

      <div class="dashboard-tabs">
        <button class="tab-btn active" data-tab="upcoming">Предстоящие</button>
        <button class="tab-btn" data-tab="past">Прошедшие</button>
        <button class="tab-btn" data-tab="cancelled">Отменённые</button>
      </div>

      <div id="bookingsList" class="bookings-list">
        <!-- Записи рендерятся через JS -->
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">📅</div>
        <h3>Пока нет записей</h3>
        <p>Найдите психолога и запишитесь на первую сессию</p>
        <a href="catalog.html" class="btn btn-primary">Найти психолога</a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2025 Равоншинос. Все права защищены.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
