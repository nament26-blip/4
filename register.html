<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Равоншинос</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Равоншинос</a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
      </nav>
      <div class="header-buttons">
        <a href="login.html" class="btn btn-secondary">Войти</a>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="auth-form">
        <h1>Регистрация</h1>
        <p class="auth-subtitle">Создайте аккаунт, чтобы записываться к психологам</p>

        <form id="registerForm">
          <label for="name">Имя</label>
          <input type="text" id="name" name="name" required placeholder="Ваше имя">

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">

          <label for="role">Я:</label>
          <select id="role" name="role">
            <option value="client">Клиент — ищу психолога</option>
            <option value="psychologist">Психолог — хочу консультировать</option>
          </select>

          <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
        </form>

        <p class="auth-footer">
          Уже есть аккаунт? <a href="login.html">Войти</a>
        </p>

        <div id="message" class="message"></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2025 Равоншинос. Все права защищены.</p>
    </div>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
